<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eat If 🍎 — 今天吃什么决胜轮盘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .phone-frame {
      width: 375px;
      height: 720px;
      background: #0f172a;
      border: 12px solid #1e293b;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .phone-notch {
      width: 140px; height: 24px;
      background: #1e293b;
      border-radius: 0 0 16px 16px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }
    .notch-camera { width: 8px; height: 8px; background: #090d16; border-radius: 50%; }
    .notch-speaker { width: 40px; height: 4px; background: #090d16; border-radius: 2px; }
    
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 20px; font-size: 11px; color: #94a3b8; font-weight: 600;
    }
    .app-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 18px; font-weight: 800; color: #f59e0b;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-body {
      flex: 1; padding: 20px; overflow-y: auto; text-align: center;
    }
    .wheel-box { position: relative; width: 220px; height: 220px; margin: 16px auto; }
    .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 10; color: #ef4444; font-size: 24px; }
    .wheel-circle {
      width: 100%; height: 100%; border-radius: 50%;
      background: conic-gradient(#f59e0b 0 60deg, #38bdf8 60deg 120deg, #10b981 120deg 180deg, #ec4899 180deg 240deg, #818cf8 240deg 300deg, #c084fc 300deg 360deg);
      border: 4px solid #fff; position: relative;
    }
    
    .action-btn {
      background: #f59e0b; color: #0f172a; border: none; font-weight: 800;
      padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 14px;
      width: 100%; transition: all 0.2s ease;
    }
    .action-btn:hover { opacity: 0.9; transform: scale(0.98); }
    .result-text { margin-top: 14px; font-weight: 700; color: #38bdf8; font-size: 14px; }
    .home-bar { width: 120px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; margin: 12px auto; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-notch">
      <div class="notch-camera"></div>
      <div class="notch-speaker"></div>
    </div>
    <div class="status-bar">
      <span>14:20</span>
      <span>📶 5G  🔋 100%</span>
    </div>
    <div class="app-header">
      <span>今天吃什么？</span>
      <span style="font-size:12px; opacity:0.7;">Android H5 Demo</span>
    </div>
    <div class="app-body">
      <div class="wheel-box" onclick="spinWheel()">
        <div class="wheel-pointer">▼</div>
        <div class="wheel-circle" id="wheelCircle"></div>
      </div>
      <button class="action-btn" onclick="spinWheel()">🎲 开始随机抽取！</button>
      <div id="resultText" class="result-text">点击轮盘或按钮，决胜今日美食！</div>

      <div style="margin-top:20px; text-align:left; background:#1e293b; padding:14px; border-radius:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="font-size:13px; color:#f59e0b;">📜 今日抽取历史</strong>
          <button onclick="addCustomFood()" style="background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:11px; padding:4px 8px; border-radius:6px; cursor:pointer;">＋ 新增菜品</button>
        </div>
        <div id="historyLog" style="font-size:12px; color:#94a3b8; line-height:1.6;">暂无历史记录</div>
      </div>
    </div>
    <div class="home-bar"></div>
  </div>

  <script>
    let foods = JSON.parse(localStorage.getItem('eat_if_foods') || 'null') || [
      '火锅 🍲', '烧烤 🍢', '麻辣烫 🍜', '汉堡包 🍔', '日料寿司 🍣', '轻食沙拉 🥗'
    ];
    let historyLogs = JSON.parse(localStorage.getItem('eat_if_history') || '[]');
    let spinning = false;

    function renderHistory() {
      const box = document.getElementById('historyLog');
      if (!historyLogs.length) { box.innerText = '暂无历史记录'; return; }
      box.innerHTML = historyLogs.slice(-3).reverse().map(h => `<div>• ${h.time} — <strong>${h.choice}</strong></div>`).join('');
    }

    function spinWheel() {
      if (spinning) return;
      spinning = true;
      const circle = document.getElementById('wheelCircle');
      const deg = 1440 + Math.floor(Math.random() * 360);
      circle.style.transition = 'transform 3s cubic-bezier(0.15, 0.9, 0.15, 1)';
      circle.style.transform = `rotate(${deg}deg)`;
      
      setTimeout(() => {
        spinning = false;
        const choice = foods[Math.floor(Math.random() * foods.length)];
        document.getElementById('resultText').innerText = `🎉 决定了！今天吃：${choice}`;
        const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        historyLogs.push({ time, choice });
        localStorage.setItem('eat_if_history', JSON.stringify(historyLogs));
        renderHistory();
      }, 3000);
    }

    function addCustomFood() {
      const name = prompt('输入您想添加的菜品或美食名:');
      if (name && name.trim()) {
        foods.push(name.trim());
        localStorage.setItem('eat_if_foods', JSON.stringify(foods));
        alert('✅ 已将「' + name.trim() + '」加进轮盘菜单！');
      }
    }

    renderHistory();
  </script>
</body>
</html>
